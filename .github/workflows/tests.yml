name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: "PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: [11, 12, 13]
        include:
          - laravel: 11
            testbench: "^9.0"
          - laravel: 12
            testbench: "^10.0"
          - laravel: 13
            testbench: "^11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Configurer PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            composer-php${{ matrix.php }}-

      - name: Installer les dépendances (Laravel ${{ matrix.laravel }})
        run: |
          composer require \
            "illuminate/support:^${{ matrix.laravel }}" \
            "illuminate/http:^${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Lancer les tests
        run: vendor/bin/phpunit
